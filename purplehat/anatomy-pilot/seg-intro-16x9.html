<!doctype html><html><head><meta charset="utf-8"><style>@font-face{font-family:Manrope;src:url(Manrope-800.woff);font-weight:800}@font-face{font-family:Manrope;src:url(Manrope-500.woff);font-weight:500}
*{box-sizing:border-box}html,body{margin:0;background:#000}
#frame{position:relative;width:1920px;height:1080px;overflow:hidden;background:radial-gradient(120% 90% at 50% 38%,#17151d 0%,#0d0c10 60%,#08080a 100%)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,"DejaVu Sans Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:#7b7690}
.corner{position:absolute;font-size:17px}

#c{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 220px}
#c .lock{display:flex;align-items:center;gap:22px;margin-bottom:46px}#c .lock svg{width:64px;height:64px}
#c .lock b{font:800 34px Manrope,sans-serif;color:#f2f0f7;letter-spacing:-.02em}
#c h1{font:800 96px/1.0 Manrope,sans-serif;letter-spacing:-.03em;color:#f2f0f7;margin:0 0 40px}
#c h1 i{font-style:normal;color:#a99bff}
#c ol{list-style:none;margin:0;padding:0;columns:2;column-gap:60px}#c li{font-size:20px;padding:7px 0;opacity:0}
#c li span{color:#8f7bff;margin-right:18px}</style></head><body><div id="frame"><div id="c">
<div class="lock" data-a="0"><svg viewBox="-110 -110 220 220"><path d="M-67.7 -73.6A100 100 0 0 1 67.7 -73.6A85 85 0 0 1 -67.7 -73.6Z M67.7 73.6A100 100 0 0 1 -67.7 73.6A85 85 0 0 1 67.7 73.6Z M-73.6 67.7A100 100 0 0 1 -73.6 -67.7A85 85 0 0 1 -73.6 67.7Z" fill="#F6F4EF"/><path d="M73.6 -67.7A100 100 0 0 1 73.6 67.7A85 85 0 0 1 73.6 -67.7Z" fill="#D7CFFF"/></svg><b>PurpleHat Events</b></div>
<h1 data-a="1">Seven services.<br><i>Built like machines.</i></h1>
<ol><li class="mono" data-li="0"><span>01</span>Event management</li><li class="mono" data-li="1"><span>02</span>Conferences &amp; PCO</li><li class="mono" data-li="2"><span>03</span>MICE &amp; incentives</li><li class="mono" data-li="3"><span>04</span>Websites &amp; apps</li><li class="mono" data-li="4"><span>05</span>Experiential installations</li><li class="mono" data-li="5"><span>06</span>Branding &amp; design</li><li class="mono" data-li="6"><span>07</span>Corporate events</li></ol></div></div>
<script>
const sm = (x) => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };
const A = [...document.querySelectorAll("[data-a]")], LI = [...document.querySelectorAll("[data-li]")];
window.frame = (f) => { const t = f / 30;
  A.forEach((el, i) => { const k = sm((t - 0.15 - i * 0.35) / 0.7); el.style.opacity = k; el.style.transform = "translateY(" + ((1 - k) * 24) + "px)"; });
  LI.forEach((el, i) => { const k = sm((t - 1.0 - i * 0.12) / 0.5); el.style.opacity = k; el.style.transform = "translateX(" + ((1 - k) * -16) + "px)"; }); };
window.TOTAL = 120; window.READY = document.fonts.ready;
</script></body></html>
