<!doctype html><html><body style="margin:0;background:#000"><canvas id="c" width="1920" height="1080"></canvas><script>
const W = 1920, H = 1080, FPS = 30, DUR = 28.85;
const IW = 1672, IH = 941, BASE = Math.max(W / IW, H / IH);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const sineIO = (x) => 0.5 - 0.5 * Math.cos(Math.PI * clamp(x));
const outCubic = (x) => 1 - Math.pow(1 - clamp(x), 3);
const inCubic = (x) => Math.pow(clamp(x), 3);
const outExpo = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * clamp(x)));
function mulberry(a) { return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const sn = (t, f, s) => Math.sin(t * f + s) * 0.6 + Math.sin(t * f * 2.13 + s * 1.7) * 0.4;

const IMG = {};
const NAMES = ['K1_venue_wide', 'K2_cap_on', 'K3a_cable', 'K3b_stitch', 'K3c_lamp', 'K4_rain', 'K5_lanterns', 'K6_countdown', 'K7_crowd', 'K8_exhale', 'K9_overhead'];
window.READY = Promise.all(NAMES.map((n) => new Promise((res) => { const i = new Image(); i.onload = () => { IMG[n] = i; res(); }; i.src = 'img/PH_' + n + '.png'; })));

// camera: focus point (image px), scale multiplier s, rotation r
function shotCam(ctx, img, fx, fy, s, r = 0, ox = 0, oy = 0) {
  const S = BASE * s, hw = W / 2 / S, hh = H / 2 / S;
  if (!r) { fx = clamp(fx, hw, IW - hw); fy = clamp(fy, hh, IH - hh); }
  ctx.save(); ctx.translate(W / 2 + ox, H / 2 + oy); ctx.rotate(r); ctx.scale(S, S); ctx.translate(-fx, -fy);
  ctx.drawImage(img, 0, 0, IW, IH); ctx.restore();
}
const N = (fx, fy) => [fx * IW, fy * IH];

const DUST = (() => { const r = mulberry(4), a = []; for (let i = 0; i < 150; i++) a.push({ x: r() * W, y: r() * H, s: 0.8 + r() * 2.6, vx: 8 + r() * 22, vy: -4 - r() * 10, ph: r() * 6.28, a: 0.25 + r() * 0.5 }); return a; })();
const RAIN = (() => { const r = mulberry(9), a = []; for (let i = 0; i < 260; i++) a.push({ x: r() * (W + 400), y: r() * (H + 200), v: 1700 + r() * 900, l: 36 + r() * 60, a: 0.12 + r() * 0.25 }); return a; })();
const GRAIN = (() => { const out = []; for (let k = 0; k < 6; k++) { const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d'), d = x.createImageData(256, 256), r = mulberry(100 + k); for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (r() - 0.5) * 120; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } x.putImageData(d, 0, 0); out.push(c); } return out; })();

const SHOTS = [
  { n: 'K1_venue_wide', a: 0, b: 3.0, cam: (u) => { const [x0, y0] = N(0.5, 0.5), [x1, y1] = N(0.62, 0.46), k = sineIO(u); return [lerp(x0, x1, k), lerp(y0, y1, k), lerp(1.0, 1.1, k)]; }, fx: 'dust' },
  { n: 'K2_cap_on', a: 3.0, b: 5.0, cam: (u) => { const k = sineIO(u), [x0, y0] = N(0.46, 0.42), [x1, y1] = N(0.42, 0.36); return [lerp(x0, x1, k), lerp(y0, y1, k), lerp(1.06, 1.15, k)]; }, fx: 'dust' },
  { n: 'K3a_cable', a: 5.0, b: 6.0, cam: (u) => { const k = outCubic(u), [x, y] = N(0.6, 0.5); return [x, y, lerp(1.04, 1.14, k)]; } },
  { n: 'K3b_stitch', a: 6.0, b: 7.0, cam: (u) => { const k = outCubic(u), [x, y] = N(0.7, 0.3); return [x, y, lerp(1.04, 1.14, k)]; } },
  { n: 'K3c_lamp', a: 7.0, b: 8.0, cam: (u) => { const k = outCubic(u), [x, y] = N(0.47, 0.5); return [x, y, lerp(1.0, 1.1, k)]; }, fx: 'lampon' },
  { n: 'K4_rain', a: 8.0, b: 12.0, cam: (u) => { const k = sineIO(u), [x0, y0] = N(0.55, 0.42), [x1, y1] = N(0.5, 0.5); return [lerp(x0, x1, k), lerp(y0, y1, k), lerp(1.14, 1.0, k)]; }, fx: 'rain' },
  { n: 'K5_lanterns', a: 12.0, b: 16.0, cam: (u) => { const k = sineIO(u), [x, y0] = N(0.5, 0.66), [, y1] = N(0.5, 0.38); return [x, lerp(y0, y1, k), 1.2]; } },
  { n: 'K6_countdown', a: 16.0, b: 19.0, cam: (u, t) => { const k = sineIO(u), [x0, y0] = N(0.33, 0.45), [x1, y1] = N(0.3, 0.42); return [lerp(x0, x1, k) + sn(t, 1.3, 1) * 6, lerp(y0, y1, k) + sn(t, 1.1, 4) * 5, lerp(1.08, 1.17, k)]; } },
  { n: 'K7_crowd', a: 19.0, b: 23.0, cam: (u, t) => { const k = outCubic(u), [x, y] = N(0.5, 0.5), sh = Math.exp(-(t - 19) * 5) * 14; return [x + sn(t, 37, 1) * sh, y + sn(t, 41, 3) * sh, lerp(1.2, 1.04, k)]; }, fx: 'flash' },
  { n: 'K8_exhale', a: 23.0, b: 25.5, xin: 0.35, cam: (u) => { const k = sineIO(u), [x0, y0] = N(0.62, 0.42), [x1, y1] = N(0.66, 0.38); return [lerp(x0, x1, k), lerp(y0, y1, k), lerp(1.04, 1.13, k)]; } },
  { n: 'K9_overhead', a: 25.5, b: DUR, xin: 0.5, rot: true, cam: (u, t) => {
      // settle: slow rotation easing to a stop, then a dive into the cap that lands exactly on the logo pose
      const t1 = t - 25.5, settle = outCubic(t1 / 1.7), dive = inCubic((t1 - 1.55) / (DUR - 25.5 - 1.55));
      const r = lerp(-0.26, -0.05, settle) * (1 - dive);
      const sEnd = 292 / (53 * BASE), s = lerp(lerp(1.62, 1.48, settle), sEnd, dive);
      const S = BASE * s, fy = lerp(470.5, 425 + 138 / S, dive), fx = lerp(836, 836, dive);
      return [fx, fy, s, r];
    }, fx: 'bloom' },
];

function fxLayer(ctx, sh, t) {
  const u = t - sh.a;
  if (sh.fx === 'dust') {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (const p of DUST) { const x = (p.x + p.vx * t + 30 * Math.sin(t * 0.7 + p.ph)) % W, y = (p.y + p.vy * t + H) % H, tw = 0.6 + 0.4 * Math.sin(t * 3 + p.ph);
      const g = ctx.createRadialGradient(x, y, 0, x, y, p.s * 3); g.addColorStop(0, `rgba(255,214,160,${p.a * tw})`); g.addColorStop(1, 'rgba(255,214,160,0)'); ctx.fillStyle = g; ctx.fillRect(x - p.s * 3, y - p.s * 3, p.s * 6, p.s * 6); }
    ctx.restore();
  }
  if (sh.fx === 'rain') {
    ctx.save(); ctx.strokeStyle = 'rgba(225,220,255,1)'; ctx.lineWidth = 1.3; ctx.lineCap = 'round';
    for (const p of RAIN) { const y = (p.y + p.v * t) % (H + 200) - 100, x = (p.x - 0.18 * (p.y + p.v * t) % (W + 400) + W + 400) % (W + 400) - 200;
      ctx.globalAlpha = p.a; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 0.18 * p.l, y + p.l); ctx.stroke(); }
    ctx.restore();
  }
  if (sh.fx === 'lampon') { // dark until the lamp strikes at 7.2 s, with a flicker
    const k = u < 0.2 ? 0 : clamp((u - 0.2) / 0.18); const fl = u > 0.2 && u < 0.45 ? 0.75 + 0.25 * Math.sin(u * 140) : 1;
    ctx.fillStyle = `rgba(10,6,24,${0.78 * (1 - k * fl)})`; ctx.fillRect(0, 0, W, H);
  }
  if (sh.fx === 'flash') { const a = Math.exp(-u * 6) * 0.65; if (a > 0.01) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = `rgba(255,224,170,${a})`; ctx.fillRect(0, 0, W, H); ctx.restore(); } }
  if (sh.fx === 'bloom') { const k = clamp((t - (DUR - 0.45)) / 0.45); if (k > 0) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; const g = ctx.createRadialGradient(960, 402, 50, 960, 402, 900); g.addColorStop(0, `rgba(215,207,255,${0.55 * k})`); g.addColorStop(1, 'rgba(94,68,232,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.restore(); } }
}

function drawShot(ctx, sh, t) {
  const u = (t - sh.a) / (sh.b - sh.a), c = sh.cam(u, t);
  shotCam(ctx, IMG[sh.n], c[0], c[1], c[2], sh.rot ? c[3] : 0);
  fxLayer(ctx, sh, t);
}
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const VIG = (() => { const c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d'); const g = x.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, W * 0.62); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(8,4,20,0.42)'); x.fillStyle = g; x.fillRect(0, 0, W, H); return c; })();
window.frame = (f) => {
  const t = f / FPS; ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < SHOTS.length; i++) {
    const sh = SHOTS[i], nx = SHOTS[i + 1], end = nx ? nx.a + (nx.xin || 0) : sh.b;
    if (t >= sh.a && t < end) { ctx.globalAlpha = 1; drawShot(ctx, sh, t); }
  }
  for (const sh of SHOTS) if (sh.xin && t >= sh.a && t < sh.a + sh.xin) { ctx.save(); ctx.globalAlpha = sineIO((t - sh.a) / sh.xin); drawShot(ctx, sh, t); ctx.restore(); }
  ctx.globalAlpha = 1; ctx.drawImage(VIG, 0, 0);
  ctx.save(); ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = 0.09; const gp = ctx.createPattern(GRAIN[f % 6], 'repeat'); ctx.fillStyle = gp; ctx.fillRect(0, 0, W, H); ctx.restore();
  return cv.toDataURL('image/png');
};
window.TOTAL = Math.round(DUR * FPS);
</script></body></html>
